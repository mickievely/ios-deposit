[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-deposit"
version = "0.1.3"
description = "아이폰 단축어 카카오뱅크 입금 문자 수신 서버"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mickievely" }]
keywords = ["ios", "shortcuts", "kakaobank", "deposit", "webhook"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mickievely/ios-deposit"
Repository = "https://github.com/mickievely/ios-deposit"

[project.scripts]
ios-deposit = "ios_deposit.cli:main"

[tool.setuptools.packages.find]
include = ["ios_deposit*"]
namespaces = true

[tool.setuptools.package-data]
ios_deposit = ["config.example.json"]
